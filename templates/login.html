<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LOGIN PAGE </title>
      <style>
      body{
                  width: 100%;
                  height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                    background:  linear-gradient(45deg,rgba(211, 4, 211, 0.902),rgba(51, 125, 236, 0.865),rgba(8, 57, 190, 0.943));
            }
            .login{
                 width: 250px;
                 min-height: 250px;
                 border: 1px solid black;
                 border-radius: 10px;
                 text-align: center;
                 background: #fff;
                 transition:  all 0.5s;
            }
            .login:hover{
                  box-shadow: 2px 2px 10px 2px #203739;
                  transform:scale(1.05);
                  transition: all 0.5s;
            }
            .login h1{
                  color: #000;
            }
            .login input{
                  padding: 6px 4px ;
                  width: 200px;
                  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .login button{
                   background: linear-gradient(45deg,rgb(20, 113, 180),#ff03c0);
                   font-size: 17px;
                   padding: 6px 10px ;
                   border-radius: 5px ;
                   color: #fff;
                   margin-bottom: 5px;
            }
      </style>
</head>
<body>
<div class="login">
            <h1>LOGIN HERE </h1>
<form method="POST" action="/login">
<input type="email" name="email" placeholder="Enter Email"><br><br>
<input type="password" name="password" placeholder="Enter Password"><br><br>
<button type="submit">Login</button>
</form> 
</div>
</body>
</html>
