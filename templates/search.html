<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Canteen Management System</title>
  <link rel="stylesheet" href="static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" src="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: #f4f4f4;
    }

    .card img {
      height: 170px;
      object-fit: cover;
    }
  </style>
  <style>
    .food-card {
      transition: 0.3s;
      border-radius: 12px;
      overflow: hidden;
    }

    .food-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .food-img {
      height: 200px;
      object-fit: cover;
    }

    .card-title {
      font-weight: bold;
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">🍴 Canteen System</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin">Admin</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin">Admin</a>
          </li>

        </ul>

        <form class="d-flex" action="/search" method="POST">

          <input type="text" class="form-control me-2" name="keyword" placeholder="Search food">

          <button class="btn btn-success" type="submit">Search</button>

        </form>

      </div>

    </div>

  </nav>

  <!-- HEADER -->

  <div class="container mt-4">
    <div class="row">

      {% for food in foods %}
      <div class="col-md-4 mb-4">

        <div class="card food-card shadow">

          <img src="{{ url_for('static', filename='images/' + food.name|lower|replace(' ','_') + '.jpg') }}"
            class="card-img-top" style="height:200px; object-fit:cover;">


          <div class="card-body">

            <h5 class="card-title">{{food.name}}</h5>

            <p class="card-text text-muted">
              {{food.description}}
            </p>
            <form action="/orders">
              <input type="number" placeholder="quantity" required>
            </form>
            <br>
            <div class="d-flex justify-content-between align-items-center">

              <h6 class="text-success">₹ {{food.price}}</h6>

              <button class="btn btn-danger btn-sm">
                Order Now
              </button>
              </form>
            </div>

          </div>
        </div>

      </div>
      {% endfor %}

    </div>
  </div>

  <div class="container-fluid footer">
    <div class="row p-3">
      <div class="col-sm-6">
        <p>91+6388052523</p>
      </div>
      <div class="col-sm-6" style="text-align: right;">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis, odio.
      </div>
    </div>
  </div>
</body>

</html>
